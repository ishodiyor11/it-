{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="glass-panel text-center mb-4">
            <img src="{{ user.profile.avatar.url }}" class="rounded-circle img-thumbnail mb-3"
                style="width: 150px; height: 150px; object-fit: cover;">
            <h3>{{ user.username }}</h3>
            <p>{{ user.email }}</p>
            <p class="text-muted"><small>Qo'shilgan sana: {{ user.date_joined|date:"d-M. Y" }}</small></p>
        </div>
    </div>
    <div class="col-md-8">
        <div class="glass-panel mb-4">
            <h4>Profil Sozlamalari</h4>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ u_form.as_p }}
                {{ p_form.as_p }}
                <div class="mt-3">
                    <button class="btn btn-success" type="submit">Saqlash</button>
                </div>
            </form>
        </div>

        <div class="glass-panel">
            <h4 class="mb-3">Statistika</h4>
            <div class="row text-center">
                <div class="col-6 mb-3">
                    <div class="card p-3">
                        <h1>{{ user.quiz_attempts.count }}</h1>
                        <small>Testlar soni</small>
                    </div>
                </div>
                <!-- Logic for average score can be added here -->
            </div>
        </div>
    </div>
</div>
{% endblock content %}
